name: Music DNA Riff Morphology

on:
  push:
    branches:
      - agent/music-dna-genre-engine
  workflow_dispatch:

jobs:
  music-dna-gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mido
      - name: Run morphology and Chainsaw gauntlet
        run: |
          python -m unittest \
            fusion_lab.tests.test_music_dna_riff_morphology \
            fusion_lab.tests.test_music_dna_genre_profiles \
            fusion_lab.tests.test_music_dna_validator \
            fusion_lab.tests.test_music_dna_coupling \
            fusion_lab.tests.test_chainsaw_diplomacy \
            fusion_lab.tests.test_chainsaw_music_dna \
            fusion_lab.tests.test_articulation_sfz_routing -v
