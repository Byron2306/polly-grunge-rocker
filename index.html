<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#09090b" />
  <title>Polly Grunge Rocker — Shitty Block Fighter</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09090b;color:#eee;font-family:monospace;overscroll-behavior:none}body{touch-action:none}#game-root{position:fixed;inset:0;display:grid;place-items:center;background:#09090b}#game-root canvas{display:block;image-rendering:pixelated;max-width:100vw;max-height:100vh}#rotate-gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:32px;text-align:center;background:#09090bf2}#rotate-gate[hidden]{display:none!important}#rotate-message{font-weight:800;font-size:clamp(24px,7vw,44px);letter-spacing:.05em}#enter-landscape{border:2px solid #eee;background:#1d1d22;color:#fff;padding:14px 22px;font:700 18px monospace;border-radius:10px}#touch-controls{display:none;position:fixed;inset:0;z-index:30;pointer-events:none}body.touch-capable:not(.portrait-device) #touch-controls{display:block}.touch-control{pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none}.round{position:absolute;display:grid;place-items:center;border:2px solid #ffffff70;background:#17171ccc;color:white;font:800 14px monospace;border-radius:50%;box-shadow:0 4px 14px #0008}#move-pad{left:max(18px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));width:clamp(118px,21vw,170px);aspect-ratio:1;border:2px solid #ffffff55;background:#11111777}#move-stick{width:42%;aspect-ratio:1;border-radius:50%;background:#e34747cc;border:2px solid #fff8;transition:transform 30ms linear}.action{width:clamp(70px,12vw,96px);aspect-ratio:1}.action:active{transform:scale(.94)}#touch-light{right:max(24px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));background:#d936b5d9}#touch-heavy{right:calc(max(24px,env(safe-area-inset-right)) + clamp(78px,13vw,108px));bottom:calc(max(26px,env(safe-area-inset-bottom)) + clamp(48px,8vw,72px));background:#b12a7ed9}#touch-use{right:calc(max(24px,env(safe-area-inset-right)) + clamp(78px,13vw,108px));bottom:max(26px,env(safe-area-inset-bottom));background:#4b7e62d9}#touch-sprint{left:calc(max(18px,env(safe-area-inset-left)) + clamp(118px,21vw,170px) + 14px);bottom:max(26px,env(safe-area-inset-bottom));width:clamp(62px,10vw,82px);aspect-ratio:1;background:#555a66d9}
  </style>
</head>
<body>
  <div id="game-root"></div>
  <div id="rotate-gate" hidden>
    <div id="rotate-message">ROTATE PHONE TO LANDSCAPE</div>
    <div>Tap below to request fullscreen + landscape. If Android refuses, rotate manually.</div>
    <button id="enter-landscape" type="button">ENTER LANDSCAPE</button>
  </div>
  <div id="touch-controls" aria-label="mobile game controls">
    <div id="move-pad" class="round touch-control" aria-label="move"><div id="move-stick"></div></div>
    <button id="touch-sprint" class="round touch-control" type="button">RUN</button>
    <button id="touch-heavy" class="round action touch-control" type="button">HEAVY</button>
    <button id="touch-use" class="round action touch-control" type="button">USE</button>
    <button id="touch-light" class="round action touch-control" type="button">LIGHT</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script type="module" src="./dist/main.js"></script>
</body>
</html>
